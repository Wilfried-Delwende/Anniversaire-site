<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Pour Myly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script>
    function afficherErreurChargement(msg) {
      var el = document.getElementById('erreurChargement');
      if (!el) {
        el = document.createElement('div');
        el.id = 'erreurChargement';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#e0637a;color:#fff;padding:14px 16px;font-family:monospace;font-size:12px;white-space:pre-wrap;';
        document.body.appendChild(el);
      }
      el.textContent += (el.textContent ? '\n---\n' : 'ERREUR :\n') + msg;
    }
    window.addEventListener('error', function (e) {
      afficherErreurChargement((e.error && e.error.message) || e.message || 'Erreur inconnue');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var raison = e.reason;
      afficherErreurChargement((raison && raison.message) || String(raison) || 'Erreur inconnue (promesse)');
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
