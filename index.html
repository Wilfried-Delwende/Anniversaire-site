<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Pour Myly</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css-tokens.css?v=4">
<link rel="stylesheet" href="css-base.css?v=4">
<link rel="stylesheet" href="css-bear.css?v=4">
<link rel="stylesheet" href="css-salle0.css?v=4">
<link rel="stylesheet" href="css-salle1.css?v=4">
</head>
<body>

  <div id="app">

    <!-- ============ SALLE 0 : Accueil ============ -->
    <section class="scene is-active" id="scene-accueil">
      <button class="mode-toggle" id="modeToggle" type="button"></button>
      <div class="accueil-card">
        <p class="accueil-eyebrow"></p>
        <h1 class="accueil-titre"></h1>
        <p class="accueil-desc"></p>
        <button class="accueil-bouton" type="button"></button>
      </div>
    </section>

    <!-- ============ SALLE 0 : Couloir ============ -->
    <section class="scene" id="scene-couloir">
      <div class="couloir-scroll" id="couloirScroll"></div>
      <p class="couloir-compteur" id="couloirCompteur"></p>
      <p class="couloir-hint" id="couloirHint">Glisse vers la gauche pour avancer</p>
    </section>

    <!-- ============ SALLE 1 : Le Mystère ============ -->
    <section class="scene" id="scene-salle1">
      <div class="salle1-monde" id="salle1Monde">

        <!-- Strate haute : le ciel -->
        <div class="salle1-couche salle1-couche--ciel" id="coucheCiel">
          <div class="nuages"></div>
          <div class="confettis" id="confettis"></div>

          <p class="texte-anniversaire" id="texteAnniversaire">Joyeux Anniversaire 🎉</p>

          <div class="gateau" id="gateau">
            <div class="bougie" id="bougie">
              <span class="bougie-flamme"></span>
              18
            </div>
            <div class="gateau-etage gateau-etage--3"></div>
            <div class="gateau-etage gateau-etage--2"></div>
            <div class="gateau-etage gateau-etage--1"></div>
          </div>

          <p class="texte-voeu" id="texteVoeu">Souffle et fais un vœu</p>
          <button class="bouton-souffler" id="boutonSouffler" type="button">Souffle la bougie 💨</button>

          <div class="ballon-volant" id="ballonVolant"></div>
          <div class="coeur-volant" id="coeurVolant"></div>
        </div>

        <!-- Strate du milieu : la pièce -->
        <div class="salle1-couche salle1-couche--piece" id="couchePiece">
          <div class="halo-lampe" id="haloLampe"></div>
          <button class="lampe" id="boutonLampe" type="button" aria-label="Tirer sur la ficelle de la veilleuse">
            <span class="lampe-globe"></span>
            <span class="lampe-fil"></span>
            <span class="lampe-poignee"></span>
          </button>
          <div class="montage-bras" id="montageBras"></div>
          <div class="eclaboussure-gateau" id="eclaboussureGateau"></div>
        </div>

        <!-- Strate basse : le sol et l'arbre -->
        <div class="salle1-couche salle1-couche--sol" id="coucheSol">
          <p class="message-final hidden" id="messageFinalArbre"></p>
          <div class="arbre" id="arbre">
            <div class="arbre-feuillage" id="arbreFeuillage"></div>
            <div class="arbre-tronc"></div>
          </div>
        </div>

      </div>

      <!-- Couche caméra fixe : l'ours s'y déplace indépendamment du fond -->
      <div id="bearCameraLayer"></div>

      <div class="bear-dialogue" id="dialogueSalle1"><p id="texteDialogueSalle1"></p></div>

      <button class="hidden" id="boutonSuiteSalle1" type="button">Continuer</button>
    </section>

    <!-- ============ SALLE 2 : en préparation ============ -->
    <section class="scene" id="scene-salle2">
      <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-family:var(--font-mono);font-size:0.8rem;text-align:center;padding:24px;">
        Salle 2 — Melody — à venir
      </div>
    </section>

  </div>

  <div class="transition-flash" id="transitionFlash"></div>
  <div class="transition-flash" id="explosionFlash"></div>

  <script>
    function afficherErreurChargement(msg) {
      var el = document.getElementById('erreurChargement');
      if (!el) {
        el = document.createElement('div');
        el.id = 'erreurChargement';
        el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#e0637a;color:#fff;padding:14px 16px;font-family:monospace;font-size:12px;white-space:pre-wrap;';
        document.body.appendChild(el);
      }
      el.textContent += (el.textContent ? '\n---\n' : 'ERREUR :\n') + msg;
    }
    window.addEventListener('error', function (e) {
      afficherErreurChargement((e.error && e.error.message) || e.message || 'Erreur inconnue');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var raison = e.reason;
      afficherErreurChargement((raison && raison.message) || String(raison) || 'Erreur inconnue (promesse)');
    });
  </script>
  <script type="module" src="js-main.js?v=4"></script>
</body>
</html>
